[build]
  command = "npm run build:demo"
  publish = "dist/spa"

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
